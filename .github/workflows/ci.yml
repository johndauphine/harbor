name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python scripts/generate_notices.py --check
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: go mod verify
      - run: go test -race -timeout 5m ./...
      - run: go vet ./...
      - name: Windows desktop compilation and regressions
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go test -tags desktop,production -timeout 5m ./...
          go vet -tags desktop,production ./...
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -platform windows/amd64,windows/arm64 -tags desktop -s -skipbindings -webview2 error
      - name: Multi-GiB transfer integrity
        shell: bash
        env:
          HARBOR_GIB_TEST: '1'
        run: |
          python -c "import shutil,tempfile; assert shutil.disk_usage(tempfile.gettempdir()).free >= 8 * 1024**3, 'Multi-GiB test requires at least 8 GiB free temporary disk space'"
          go test -run '^TestStreamingMultiGiBTransfers$' -count=1 -timeout 10m ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os != 'macOS'
        with:
          node-version: '24'
      - name: Frontend and native browser regressions
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            HARBOR_TEST_CHROMIUM="$(python -c "import os,pathlib,sys; roots=[os.environ.get('PROGRAMFILES',''),os.environ.get('PROGRAMFILES(X86)','')]; paths=[pathlib.Path(root)/part for root in roots if root for part in ['Google/Chrome/Application/chrome.exe','Microsoft/Edge/Application/msedge.exe']]; found=next((path for path in paths if path.is_file()),None); assert found, 'Chrome or Edge is required for native Windows browser regression coverage'; sys.stdout.write(str(found))")"
          else
            HARBOR_TEST_CHROMIUM="$(command -v google-chrome)"
            test -x "$HARBOR_TEST_CHROMIUM"
          fi
          export HARBOR_TEST_CHROMIUM
          node --test tests/*.test.cjs

      - name: Native archive extraction and isolated startup
        shell: bash
        run: |
          harbor_target="$(go env GOOS)/$(go env GOARCH)"
          python scripts/package_release.py --version "development-${GITHUB_SHA::12}" --target "$harbor_target" --output dist/native
          harbor_suffix=zip
          if [[ "$RUNNER_OS" != "Windows" ]]; then harbor_suffix=tar.gz; fi
          python scripts/check_archive.py "dist/native/harbor-development-${GITHUB_SHA::12}-${harbor_target/\//-}.$harbor_suffix"

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: darwin, arch: arm64}
          - {os: windows, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: linux, arch: amd64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Check reachable vulnerabilities for shipped target
        run: govulncheck ./...
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'

  builds:
    needs: [test, vulnerabilities]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build versioned unsigned archives and checksums
        shell: bash
        run: python scripts/package_release.py --version "development-${GITHUB_SHA::12}" --output dist
      - name: Describe artifact trust status
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Development artifacts
          These versioned archives contain unsigned CI builds, not a published or trusted release.
          The macOS tar archive preserves executable permissions; Windows builds use ZIP.
          SHA256SUMS detects file changes; it does not establish publisher identity.
          macOS public distribution still needs a valid Developer ID Application identity,
          hardened-runtime signing and Apple notarization using the owner's developer account.
          Windows publisher signing needs an approved code-signing certificate or signing service.
          Signing credentials must be configured separately; none are required or exposed by this workflow.
          SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harbor-unsigned-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
