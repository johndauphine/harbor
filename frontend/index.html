<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor · S3 Browser</title><link rel="stylesheet" href="/style.css"></head><body><header><b>◈ Harbor</b><span>S3 workspace</span><button id="add">＋ Connection</button></header><div class="workspace"><aside><h4>CONNECTIONS</h4><div id="profiles"></div><h4>BUCKETS</h4><div id="buckets"></div></aside><main><nav><button id="up">↑</button><input id="path" placeholder="Choose a bucket"><button id="go">Go</button><button id="refresh">↻ Refresh</button><input id="file" type="file" hidden><button id="new-folder">＋ New Folder</button><button id="upload">↑ Upload</button><button id="download">↓ Download</button><button id="test">Test connection</button></nav><div id="location" aria-live="polite">Choose a bucket</div><div id="message">Add a connection to start exploring your storage.</div><div class="table"><table><thead><tr><th>Name</th><th>Size</th><th>Last modified</th><th>Storage class</th></tr></thead><tbody id="objects"></tbody></table></div><button id="more" hidden>Load next page</button><section id="details">Select an object to inspect its details.</section><section><h4>TRANSFERS</h4><div id="transfers">No transfers yet</div></section></main></div><dialog id="connection"><form id="form"><h2>New connection</h2><label>Name<input name="Name" required></label><label>Endpoint (blank for AWS)<input name="Endpoint" placeholder="https://s3.example.com"></label><label>Region<input name="Region" value="us-east-1" required></label><label>Access key<input name="AccessKey" required autocomplete="off"></label><label>Secret key<input name="SecretKey" type="password" required autocomplete="off"></label><label>Session token<input name="SessionToken" type="password" autocomplete="off"></label><label>Custom CA file (absolute local path)<input name="CAFile"></label><label><input name="PathStyle" type="checkbox"> Path-style addressing</label><p>Credentials stay in your operating system’s secure vault.</p><button type="button" id="close">Cancel</button><button type="submit">Save connection</button></form></dialog><script src="/app.js"></script></body></html>
